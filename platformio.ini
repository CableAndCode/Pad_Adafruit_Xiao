; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Domyslna dla obu plytek jest 240 MHz, czyli maksimum. Zejscie na 160 MHz
; oszczedza ok. 10-15 mA i obniza temperature rdzenia. Magistrala peryferyjna
; APB zostaje na 80 MHz niezaleznie od zegara rdzenia, wiec taktowanie SPI
; wyswietlacza, I2C gamepadow i PWM silnikow sie NIE zmienia - wolniej idzie
; tylko to, co liczy procesor. Ponizej 80 MHz zegar schodzi z PLL na kwarc
; i WiFi przestaje dzialac, wiec 80 MHz to podloga.
board_build.f_cpu = 160000000L

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit seesaw Library@^1.7.9
	bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI configuration — replaces manual editing of User_Setup.h
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_REDTAB=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MOSI=9
	-DTFT_SCLK=7
	-DTFT_CS=2
	-DTFT_DC=4
	-DTFT_RST=3
	-DUSE_HSPI_PORT=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1