; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; Serial.begin(115200) w kodzie. Bez tej linii `pio device monitor` staje
; na 9600 i pokazuje krzaki - a wtedy diagnostyka startu jest nieczytelna.
monitor_speed = 115200

; Both boards default to 240 MHz, i.e. the maximum. Dropping to 160 MHz
; saves roughly 10-15 mA and lowers the core temperature. The APB peripheral
; bus stays at 80 MHz regardless of the core clock, so display SPI, gamepad I2C
; and motor PWM timing do NOT change - only what the CPU computes gets slower.
; Below 80 MHz the clock leaves the PLL for the crystal and WiFi stops working,
; so 80 MHz is the floor.
board_build.f_cpu = 160000000L

lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit seesaw Library@^1.7.9
	bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI configuration — replaces manual editing of User_Setup.h
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_REDTAB=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MOSI=9
	-DTFT_SCLK=7
	-DTFT_CS=2
	-DTFT_DC=4
	-DTFT_RST=3
	-DUSE_HSPI_PORT=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1