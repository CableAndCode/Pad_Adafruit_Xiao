; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32s3]
; Pinned deliberately. Unpinned, the build depends on whatever PlatformIO
; resolves on the day. espressif32 7.0.1 still ships Arduino core 2.0.17
; (framework-arduinoespressif32 3.20017), which is what this code needs:
; ledcSetup() and ledcAttachPin() were REMOVED in Arduino-ESP32 3.x, so a
; silent jump to a newer core would break the build for everyone at once,
; without a single line changing here. Tilde = patch updates only.
platform = espressif32 @ ~7.0.1
board = seeed_xiao_esp32s3
framework = arduino

; Serial.begin(115200) w kodzie. Bez tej linii `pio device monitor` staje
; na 9600 i pokazuje krzaki - a wtedy diagnostyka startu jest nieczytelna.
monitor_speed = 115200

; Both boards default to 240 MHz, i.e. the maximum. Dropping to 160 MHz
; saves roughly 10-15 mA and lowers the core temperature. The APB peripheral
; bus stays at 80 MHz regardless of the core clock, so display SPI, gamepad I2C
; and motor PWM timing do NOT change - only what the CPU computes gets slower.
; Below 80 MHz the clock leaves the PLL for the crystal and WiFi stops working,
; so 80 MHz is the floor.
board_build.f_cpu = 160000000L

; The display is driven by TFT_eSPI. Adafruit's ST7735 library used to be
; listed here and was never included by anything — the -DST7735_DRIVER flag
; below is TFT_eSPI's own driver selector, not a reference to that library.
lib_deps =
	adafruit/Adafruit BusIO@^1.17.0
	adafruit/Adafruit seesaw Library@^1.7.9
	bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI configuration — replaces manual editing of User_Setup.h
build_flags =
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DST7735_REDTAB=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_MOSI=9
	-DTFT_SCLK=7
	-DTFT_CS=2
	-DTFT_DC=4
	-DTFT_RST=3
	-DUSE_HSPI_PORT=1
	-DTFT_RGB_ORDER=TFT_RGB
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1